#!/bin/sh
#
#

# Convention of Linux type VM on Azure is 30G
export VMSIZE=30g

# Set to a list of packages to install.
export VM_EXTRA_PACKAGES="azure-agent python python3 firstboot-freebsd-update firstboot-pkgs net/cloud-init"

# Set to a list of third-party software to enable in rc.conf(5).
export VM_RC_LIST="ntpd sshd waagent firstboot_freebsd_update firstboot_pkgs cloudinit"

# No swap space; waagent will allocate swap space on the resource disk.
# See ResourceDisk.EnableSwap and ResourceDisk.SwapSizeMB in waagent.conf
export NOSWAP=YES

# https://learn.microsoft.com/en-us/partner-center/marketplace/azure-vm-certification-faq#vm-images-must-have-1-mb-of-free-space
export VM_BOOTPARTSOFFSET=1M

vm_extra_pre_umount() {
	mount -t devfs devfs ${DESTDIR}/dev

	# The firstboot_pkgs rc.d script will download the repository
	# catalogue and install or update pkg when the instance first
	# launches, so these files would just be replaced anyway; removing
	# them from the image allows it to boot faster.
	chroot ${DESTDIR} ${EMULATOR} env ASSUME_ALWAYS_YES=yes \
		/usr/sbin/pkg delete -f -y pkg
	rm -r ${DESTDIR}/var/db/pkg/repos/FreeBSD

	chroot ${DESTDIR} ${EMULATOR} pw usermod root -h -

	umount ${DESTDIR}/dev

	cat << EOF >> ${DESTDIR}/etc/rc.conf
ifconfig_hn0="SYNCDHCP"
ntpd_sync_on_start="YES"
EOF

	# Configure cloud-init
	cat <<-'EOF' > ${DESTDIR}/usr/local/etc/cloud/cloud.cfg.d/98_ec2.cfg
		disable_root: true
		system_info:
		  distro: freebsd
		  default_user:
		    name: azureuser
		    lock_passwd: True
		    groups: [wheel]
		    shell: /bin/sh
		    homedir: /home/azureuser
		    doas:
		    - permit nopass azureuser
	EOF

	cat << EOF >> ${DESTDIR}/boot/loader.conf
autoboot_delay="-1"
beastie_disable="YES"
loader_logo="none"
hw.memtest.tests="0"
console="comconsole efi vidconsole"
comconsole_speed="115200"
boot_multicons="YES"
boot_serial="YES"
mlx4en_load="YES"
mlx5en_load="YES"
EOF


        cat << EOF > ${DESTDIR}/usr/local/etc/waagent.conf
Extensions.Enabled=y
Provisioning.Agent=auto
Provisioning.DeleteRootPassword=y
Provisioning.RegenerateSshHostKeyPair=y
Provisioning.SshHostKeyPairType=rsa
Provisioning.MonitorHostName=y
Provisioning.DecodeCustomData=y
Provisioning.ExecuteCustomData=y
ResourceDisk.Format=y
ResourceDisk.Filesystem=ufs
ResourceDisk.MountPoint=/mnt/resource
ResourceDisk.EnableSwap=y
ResourceDisk.SwapSizeMB=2048
ResourceDisk.MountOptions=None
Logs.Verbose=y
OS.EnableFIPS=n
OS.RootDeviceScsiTimeout=300
OS.OpensslPath=None
OS.SshDir=/etc/ssh
OS.PasswordPath=/etc/master.passwd
OS.SudoersDir=/usr/local/etc/sudoers.d
OS.EnableFirewall=y
EOF

#Patching up cloud-init so that it will run without bug https://github.com/canonical/cloud-init/issues/6206
sed -i '' \
  -e 's|\["netstat", "-A", "inet6", "--route", "--numeric"\], rcs=\[0, 1\]|["netstat", "-rn", "-f", "inet6"], rcs=[0, 1]|g' \
  -e 's|\["netstat", "--route", "--numeric", "--extend"\], rcs=\[0, 1\]|["netstat", "-rn"], rcs=[0, 1]|g' \
  ${DESTDIR}/usr/local/lib/python3.11/site-packages/cloudinit/netinfo.py

#Patching waagent check for cloud-init
sed -i '' 's/def link_up(interface: str):/def link_up(interface: str, family=None):/' \
  ${DESTDIR}/usr/local/lib/python3.11/site-packages/cloudinit/net/netops/bsd_netops.py
sed -i '' 's/def link_down(interface: str):/def link_down(interface: str, family=None):/' \
  ${DESTDIR}/usr/local/lib/python3.11/site-packages/cloudinit/net/netops/bsd_netops.py

#Experimenting with changing what waagent checks for to make sure cloud-init is running
#cat > ${DESTDIR}/tmp/sysrc_function.py << 'EOF'
#def _cloudinit_is_enabled_sysrc():
#    """
#    Determine whether or not cloud-init is enabled on a sysrc machine.
#    Args:
#        None
#    Returns:
#        bool: True if cloud-init is enabled, False if otherwise.
#    """
#    try:
#        sysrc_output = subprocess.check_output([
#            'sysrc',
#            '-n',
#            'cloudinit_enable'
#        ], stderr=subprocess.STDOUT).decode('utf-8').replace('\n', '')
#        unit_is_enabled = sysrc_output == 'YES'
#    # pylint: disable=broad-except
#    except Exception as exc:
#        logger.info('Unable to get cloud-init enabled status from sysrc: {0}'.format(exc))
#        unit_is_enabled = False
#    return unit_is_enabled
#
#EOF

#Adding the lines above and making changing the cloudinitdetect.py, not a sustainable solution
#line_num=$(grep -n "def cloud_init_is_enabled():" ${DESTDIR}/usr/local/lib/python3.11/site-packages/azurelinuxagent/pa/provision/cloudinitdetect.py | cut -d: -f1)
# Create new file with insertion
#{
#    head -n $((line_num - 1)) ${DESTDIR}/usr/local/lib/python3.11/site-packages/azurelinuxagent/pa/provision/cloudinitdetect.py
#    cat /tmp/sysrc_function.py
#    tail -n +$line_num ${DESTDIR}/usr/local/lib/python3.11/site-packages/azurelinuxagent/pa/provision/cloudinitdetect.py
#} > ${DESTDIR}/tmp/new_file.py

#sudo mv ${DESTDIR}/tmp/new_file.py ${DESTDIR}/usr/local/lib/python3.11/site-packages/azurelinuxagent/pa/provision/cloudinitdetect.py

#sed -i '' 's/_cloud_init_is_enabled_systemd() or _cloud_init_is_enabled_service()/_cloud_init_is_enabled_systemd() or _cloud_init_is_enabled_service() or _cloudinit_is_enabled_sysrc()/' ${DESTDIR}/usr/local/lib/python3.11/site-packages/azurelinuxagent/pa/provision/cloudinitdetect.py

	touch ${DESTDIR}/firstboot

	return 0
}
